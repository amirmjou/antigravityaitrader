# Declarative Google Cloud Run Service Specification (Knative Serving v1)
# Apply with:
#   gcloud run services replace deploy/cloudrun-service.yaml --region=us-central1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentic-trading-bot
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/sessionAffinity: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      serviceAccountName: agentic-trading-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - name: trading-server
          image: REGION-docker.pkg.dev/PROJECT_ID/trading-repo/agentic-trading-bot:latest
          ports:
            - name: http1
              containerPort: 8899
          securityContext:
            runAsUser: 10001
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: TRADINGAGENTS_SECURITY_MODE
              value: "production"
            - name: ALLOWED_ORIGINS
              value: "https://your-trading-ui.run.app,http://localhost:3000"
            - name: TRADING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: TRADING_API_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8899
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8899
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
