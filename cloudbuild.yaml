# Google Cloud Build & Cloud Run Production Deployment Pipeline
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION="us-central1",_ALLOWED_ORIGINS="https://your-domain.com"

substitutions:
  _REGION: "us-central1"
  _REPO_NAME: "trading-repo"
  _SERVICE_NAME: "agentic-trading-bot"
  _SERVICE_ACCOUNT: "agentic-trading-sa@${PROJECT_ID}.iam.gserviceaccount.com"
  _ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

steps:
  # Step 1: Build the hardened multi-stage non-root image (UID 10001)
  - name: "gcr.io/cloud-builders/docker"
    id: "build-hardened-image"
    args:
      - "build"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--file"
      - "Dockerfile"
      - "."

  # Step 2: Push container image to Google Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-artifact-registry"
    waitFor: ["build-hardened-image"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}"

  # Step 3: Deploy to Google Cloud Run (Gen2, Always-On CPU, Secret Manager Bound)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    waitFor: ["push-artifact-registry"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--execution-environment=gen2"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--port=8899"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--no-cpu-throttling"
      - "--min-instances=1"
      - "--max-instances=1"
      - "--timeout=3600"
      - "--session-affinity"
      - "--allow-unauthenticated"
      - "--set-env-vars=^@^TRADINGAGENTS_SECURITY_MODE=production@ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}"
      - "--set-secrets=TRADING_API_KEY=TRADING_API_KEY:latest"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
